<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/script.js" type="module"></script>
    <title>Sign up form</title>
</head>

<body>
    <div class="top-container">
        <div class="left">
            <div class="left-hero">
                <div class="logo">
                    <div class="logo-bg"></div>
                    <div class="logo-text">ODIN</div>
                </div>
            </div>
            <div class="left-footer">Photo by <a class="no-link">Ali</a> on <a class="no-link">
                    Unsplash</a>
            </div>
        </div>
        <div class="right">
            <div class="title">
                <div class="form-title">This is not a real online service, this is just a header text that I put before
                    my
                    form sign up test so I can have some heading text to test the form with that looks nice, thank you!
                </div>
                <div class="form-title">
                    You <span class="italic">know</span> you want to.
                </div>
            </div>
            <form accept="./submit">
                <h2>Let's do this!</h2>
                <div class="form-field">
                    <div class="input-label first-name">
                        <label for="first-name">First Name</label>
                        <input type="text" class="first-name" name="first-name" id="first-name" required>
                    </div>
                    <div class="input-label last-name">
                        <label for="last-name">Last Name</label>
                        <input type="text" class="last-name" name="last-name" id="last-name" required>
                    </div>
                    <div class="input-label email">
                        <label for="email">Email</label>
                        <input type="email" class="email" id="email" required>
                    </div>
                    <div class="input-label phone">
                        <label for="tel">Phone Number</label>
                        <input type="tel" class="tel" id="tel" required>
                    </div>
                    <div class="input-label password">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="input-label password">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="form-submit">
                    <div class="foo">
                        <button type="submit">Create Account</button>
                        <span>
                            Already have an account? <span class="log-in">Log in </span>
                        </span>

                    </div>

                </div>
            </form>
        </div>

    </div>
</body>

</html>
