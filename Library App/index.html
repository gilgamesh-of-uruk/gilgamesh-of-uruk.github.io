<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles/reset.css" />
        <link rel="stylesheet" href="styles/style.css" />
        <script src="scripts/script.js" type="module"></script>
        <title>Library App</title>
    </head>
    <body>
        <div class="blured-bg hidden">
            <form>
                <div class="logo">
                    <h2>Add New Book</h2>
                    <input type="reset" class="reset close-form" value="X" />
                </div>
                <label for="book-title">Title: </label>
                <input
                    type="text"
                    id="book-title"
                    placeholder="e.g. The Hobbit"
                    required
                />
                <label for="book-author">Author: </label>
                <input
                    type="text"
                    id="book-author"
                    placeholder="e.g. J.R.R. Martin"
                    required
                />
                <label for="book-pages">Pages: </label>
                <input
                    type="number"
                    min="1"
                    id="book-pages"
                    required
                    placeholder="e.g. 250"
                />
                <div class="read-this row-con">
                    <input type="checkbox" id="book-read" />
                    <label for="book-read">Have read this book</label>
                </div>

                <input
                    type="submit"
                    class="submit add-new-book"
                    value="Add Book"
                />
            </form>
        </div>
        <main class="container col-con">
            <div class="copy-right">
                @Copyright this design is taken from
                <a
                    href="https://zinthuaung-lab.github.io/The-Odin-Project/Library/"
                    >zinthuaung</a
                >
            </div>
            <div class="header row-con">
                <div class="title col=con">
                    <h1 class="bold-title">My Library</h1>
                    <h4 class="soft-title">Track and manage reading list</h4>
                </div>
                <button class="add-book">+ Add New Book</button>
            </div>
            <div class="cards row-con"></div>
        </main>
    </body>
</html>
